```yaml
services:
  - type: web
    name: prediction-web
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: PHONE_NUMBER
        sync: false

      - key: CHANNEL
        value: pc28
```
